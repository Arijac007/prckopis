[package]
name = "prckopis-engine"
description = "Prckopis engine façade: session, documents, command/tool catalogue"
version.workspace = true
edition.workspace = true
license.workspace = true

[lints]
workspace = true

[dependencies]
prckopis-measure = { workspace = true }
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "tiff"] }
prckopis-render = { workspace = true }
prckopis-cos = { workspace = true }
prckopis-organize = { workspace = true }
prckopis-annot = { workspace = true }
prckopis-forms = { workspace = true }
prckopis-xfa = { workspace = true }
prckopis-edit = { workspace = true }
prckopis-audit = { workspace = true }
prckopis-redact = { workspace = true }
prckopis-print = { workspace = true }
prckopis-xfdf = { workspace = true }
prckopis-sign = { workspace = true }
prckopis-optimize = { workspace = true }
prckopis-a11y = { workspace = true }
prckopis-ocr = { workspace = true }
prckopis-js = { workspace = true }
prckopis-compare = { workspace = true }
prckopis-preflight = { workspace = true }
prckopis-export = { workspace = true }
prckopis-fonts = { workspace = true }
prckopis-create = { workspace = true }
prckopis-model = { workspace = true }
prckopis-geom = { workspace = true }
thiserror = { workspace = true }
png = "0.18"
# Already in the graph (url and idna through webbrowser, icu_properties through boa): they show
# the host of a document's link the way the browser reads it (links::display_host).
url = "2.5"
idna = "1.1"
icu_properties = "2.3"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
# Already in the graph through lopdf; used only for the local UTC offset ("today").
chrono = { version = "0.4", default-features = false, features = ["clock"] }
