[package]
name = "prckopis-android"
description = "Prckopis on Android (NativeActivity)"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version = "1.95"
publish = false

# Not the workspace lints: the entry point Android calls must be `#[unsafe(no_mangle)]`, which
# `unsafe_code = "forbid"` refuses. Everything else keeps the workspace's rules.
[lints.rust]
unsafe_code = "deny"

[lib]
name = "prckopis_android"
crate-type = ["cdylib"]
path = "src/lib.rs"

[target.'cfg(target_os = "android")'.dependencies]
prckopis-ui-egui = { workspace = true }
eframe = { workspace = true, features = ["default_fonts", "wgpu", "persistence", "links", "android-native-activity"] }
egui = { workspace = true }
# The AndroidApp handle eframe needs (the vendored winit, through [patch]).
winit = { version = "0.30", default-features = false, features = ["android-native-activity"] }
log = { workspace = true }
android_logger = "0.15"
# Asks Android for file access (Settings intents, runtime permissions) through the activity.
jni = "0.21"

# `cargo apk build -p prckopis-android --release` (docs/android.md). The release keystore is never
# in the repository: CARGO_APK_RELEASE_KEYSTORE and CARGO_APK_RELEASE_KEYSTORE_PASSWORD name it.
[package.metadata.android]
package = "ai.storyteller.prckopis"
apk_name = "prckopis"
build_targets = ["aarch64-linux-android"]

[package.metadata.android.sdk]
min_sdk_version = 26
target_sdk_version = 31

[[package.metadata.android.uses_permission]]
name = "android.permission.INTERNET"

# Shared storage, for the in-app file browser (Android 10 and earlier).
[[package.metadata.android.uses_permission]]
name = "android.permission.READ_EXTERNAL_STORAGE"
max_sdk_version = 29

[[package.metadata.android.uses_permission]]
name = "android.permission.WRITE_EXTERNAL_STORAGE"
max_sdk_version = 29

# Android 11 and later: "All files access", granted by the user in Settings.
[[package.metadata.android.uses_permission]]
name = "android.permission.MANAGE_EXTERNAL_STORAGE"

[package.metadata.android.application]
label = "Prckopis"
# Not full screen: the app is laid out below the status bar (and the camera cut-out in it) and
# above the navigation bar, where touches reach it.
theme = "@android:style/Theme.DeviceDefault.NoActionBar"

[package.metadata.android.application.activity]
config_changes = "orientation|screenSize|screenLayout|keyboardHidden|keyboard|uiMode|density"
launch_mode = "singleTop"
orientation = "unspecified"
